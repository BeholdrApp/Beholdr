name: CI

# Quality gate for every pull request: backend build/vet/format/test,
# frontend type-check/build, and a container build — all using the committed
# go.sum / package-lock.json so CI resolves the exact same dependency graph
# a local build would.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Test
        run: go test ./... -race -cover

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (deterministic)
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Loaded into the local daemon rather than discarded, so the scan below
      # runs against the artifact this PR would actually ship.
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: beholdr:ci

      # Scans the built image, not just the module graph. That distinction
      # matters here: the 2026-09-05 triage found the release binary's
      # vulnerability surface includes the Go standard library compiled into
      # it, which dependency scanning alone did not surface. Trivy inspects
      # the binary inside the image and reports the stdlib version with it.
      #
      # Gate (signed off 2026-09-09): fail on HIGH/CRITICAL findings that have
      # a fix available. Unfixed findings are still printed but do not block —
      # an unfixable upstream CVE should not wedge every pull request. Widen
      # this by setting ignore-unfixed to false.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: beholdr:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Same scan without the gate, so the log always carries the full picture
      # (including unfixed findings) even when the step above passes.
      - name: Report all findings
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: beholdr:ci
          scanners: vuln
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: table
