name: CI

# Quality gate for every pull request: backend build/vet/format/test,
# frontend type-check/build, and a container build — all using the committed
# go.sum / package-lock.json so CI resolves the exact same dependency graph
# a local build would.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      # go.mod's toolchain directive pins the exact patch release, and the
      # Dockerfile pins the same one. They are set independently, so this
      # asserts they have not drifted — a drifted pair means CI validates a
      # toolchain the release never uses. That is not hypothetical: govulncheck
      # reported 27 reachable standard-library advisories against go1.25.1 and
      # zero against the go1.25.14 the release image builds with, so the value
      # of the scan below depends on this matching.
      - name: Verify toolchain matches the release image
        run: |
          ci_version="$(go env GOVERSION)"
          image_version="go$(grep -o 'golang:[0-9.]*' Dockerfile | head -1 | cut -d: -f2)"
          echo "CI toolchain:  $ci_version"
          echo "Release image: $image_version"
          if [ "$ci_version" != "$image_version" ]; then
            echo "::error::CI builds with $ci_version but the release image uses $image_version."
            echo "Update the toolchain directive in go.mod and the golang base image in Dockerfile together."
            exit 1
          fi

      - name: Test
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      # A floor rather than a diff against the base branch: it needs no history
      # and no external service, and it fails the same way for everyone. Raise
      # .github/coverage-threshold as coverage improves — that ratchet is the
      # regression guard.
      - name: Check coverage
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')"
          floor="$(tr -d '[:space:]' < .github/coverage-threshold)"
          echo "### Go coverage: ${total}% (floor ${floor}%)" >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" -v f="$floor" 'BEGIN {
            if (t+0 < f+0) {
              print "Coverage " t "% is below the " f "% floor"
              exit 1
            }
            print "Coverage " t "% meets the " f "% floor"
          }'

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error

      # Complements the image scan in the container job: Trivy reports what is
      # present in the artifact, govulncheck reports what the code actually
      # reaches. Only reachable findings fail here, which is what the
      # signed-off severity policy gates on.
      - name: Vulnerability check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (deterministic)
        run: npm ci

      - name: Type check
        run: npm run check

      # The suite exists (vitest, in web/src/lib/*.test.ts) but was never wired
      # into CI, so it could only fail locally.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Set up Go for the isolated demo smoke test
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Smoke test the embedded demo
        run: npm run demo:check

      # Report-only, deliberately. Every frontend dependency is a
      # devDependency — the shipped SPA is compiled output with no runtime
      # dependency tree — so `npm audit --omit=dev` has nothing to audit and
      # would pass vacuously, while the full graph is exactly the
      # dev-toolchain surface the severity policy says to track rather than
      # gate on. The gate for what actually ships is the image scan in the
      # container job.
      - name: Audit dependencies (report only)
        if: always()
        run: |
          {
            echo '### npm audit (dev toolchain — not a gate)'
            echo '```'
            npm audit 2>&1 | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  iac:
    name: Infrastructure as code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive deploy/terraform

      # -backend=false keeps this offline: validation needs the provider
      # schemas, not remote state.
      - name: Terraform validate
        working-directory: deploy/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # Pinned by version and verified by checksum. Pulling a release binary
      # into CI is itself a supply-chain step, so it gets the same treatment
      # as the image and action pins.
      - name: Install kubeconform
        env:
          VERSION: v0.8.0
          SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          url="https://github.com/yannh/kubeconform/releases/download/${VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -sSLo kubeconform.tar.gz "$url"
          echo "${SHA256}  kubeconform.tar.gz" | sha256sum --check --strict
          tar xzf kubeconform.tar.gz kubeconform

      - name: Validate Kubernetes manifests
        run: ./kubeconform -strict -summary deploy/k8s/beholdr.yaml

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Loaded into the local daemon rather than discarded, so the scan below
      # runs against the artifact this PR would actually ship.
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: beholdr:ci

      # Scans the built image, not just the module graph. That distinction
      # matters here: the 2026-09-05 triage found the release binary's
      # vulnerability surface includes the Go standard library compiled into
      # it, which dependency scanning alone did not surface. Trivy inspects
      # the binary inside the image and reports the stdlib version with it.
      #
      # Gate (signed off 2026-09-09): fail on HIGH/CRITICAL findings that have
      # a fix available. Unfixed findings are still printed but do not block —
      # an unfixable upstream CVE should not wedge every pull request. Widen
      # this by setting ignore-unfixed to false.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: beholdr:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Gate application dependencies. Debian's base-files, ca-certificates
      # and netbase already carry GPL metadata in the pinned distroless base;
      # report those separately instead of treating them as new Go dependencies.
      # This does not exempt OS packages from the vulnerability gate above.
      - name: Scan application licenses
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PKG_TYPES: library
        with:
          image-ref: beholdr:ci
          scanners: license
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Report base-image licenses
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PKG_TYPES: os
        with:
          image-ref: beholdr:ci
          scanners: license
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: table

      # Same scan without the gate, so the log always carries the full picture
      # (including unfixed findings) even when the step above passes.
      - name: Report all findings
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: beholdr:ci
          scanners: vuln
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: table
