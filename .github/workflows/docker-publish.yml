name: Build and publish container image

# Builds the Beholdr image and pushes it to GitHub Container Registry (GHCR).
# Triggers:
#   - pushing a version tag like v0.1.0  -> publishes :0.1.0 (and :latest)
#   - manual run from the Actions tab    -> publishes :latest (and a sha tag)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/beholdr

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for the SBOM and provenance attestations to be signed and
      # pushed alongside the image.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # v0.1.0 -> 0.1.0 ; also tag :latest on tag/default-branch builds
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Every published image carries an SBOM and full build provenance,
          # attached to it in the registry as attestations. `provenance:
          # mode=max` records the build steps and their inputs, not just the
          # final result. Inspect either with:
          #   docker buildx imagetools inspect <image> --format '{{ json .SBOM }}'
          #   docker buildx imagetools inspect <image> --format '{{ json .Provenance }}'
          sbom: true
          provenance: mode=max

      # A registry attestation is the machine-readable copy; this is the one a
      # human can download from the workflow run when auditing a release
      # without pulling the image.
      - name: Export SBOM as a workflow artifact
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p sbom
          image="${IMAGE_NAME,,}@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "$image" --format '{{ json .SBOM }}' > sbom/beholdr-sbom.json
          jq -e 'type == "object" and length > 0' sbom/beholdr-sbom.json > /dev/null

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/beholdr-sbom.json
          if-no-files-found: error
